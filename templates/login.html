<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polla Mundialista 2026 - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-trophy"></i>
                </div>
                <h1>Polla Mundialista</h1>
                <h2>FIFA World Cup 2026</h2>
                <p>Ingresa con tu cuenta de Google para participar</p>
            </div>
            <div class="login-features">
                <div class="feature-item">
                    <i class="fas fa-futbol"></i>
                    <span>Pronostica los partidos</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-star"></i>
                    <span>Gana puntos por aciertos</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-trophy"></i>
                    <span>Compite en el ranking</span>
                </div>
            </div>
            <a href="{{ url_for('google.login') }}" class="google-btn">
                <i class="fab fa-google"></i>
                Iniciar sesión con Google
            </a>
            <p class="login-footer-text">
                Solo se usará tu nombre y foto de perfil
            </p>
        </div>
    </div>
</body>
</html>
